name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOCKER_REGISTRY: lifegoeson34
  DOCKER_REPO: be-modami-noti-service
  GOFLAGS: -mod=readonly

jobs:
  # ─── BUILD & TEST ─────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private GitLab module access
        run: |
          git config --global url."https://${{ secrets.GITLAB_USERNAME }}:${{ secrets.GITLAB_TOKEN }}@gitlab.com/".insteadOf "https://gitlab.com/"
          go env -w GOPRIVATE=gitlab.com/lifegoeson-libs/*
          go env -w GONOSUMDB=gitlab.com/lifegoeson-libs/*
          go env -w GONOPROXY=gitlab.com/lifegoeson-libs/*

      - run: go mod download
      - run: go vet ./...
      - run: go build ./...

  # ─── SECURITY ─────────────────────────────────────────────────────────────
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: json
          output: fs-report.json
          exit-code: '0'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: fs-report.json
          retention-days: 7

  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── RELEASE — 5 parallel Docker builds ───────────────────────────────────
  docker-build-push:
    runs-on: ubuntu-latest
    needs: [build, trivy-scan, gitleaks-scan]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    strategy:
      matrix:
        service: [api, ingest, ws-gateway, worker-dispatch, worker-push]
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-${{ matrix.service }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-${{ matrix.service }}:v1.0.${{ steps.vars.outputs.short_sha }}
          secrets: |
            gitlab_token=${{ secrets.GITLAB_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
