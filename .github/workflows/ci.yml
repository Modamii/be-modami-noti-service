name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOCKER_REGISTRY: lifegoeson34
  DOCKER_REPO: be-modami-noti-service
  GOFLAGS: -mod=readonly

# ─── BUILD ────────────────────────────────────────────────────────────────────

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private GitLab modules
        run: |
          git config --global url."https://${{ secrets.GITLAB_USERNAME }}:${{ secrets.GITLAB_TOKEN }}@gitlab.com/".insteadOf "https://gitlab.com/"
          go env -w GOPRIVATE=gitlab.com/lifegoeson-libs/*
          go env -w GONOPROXY=gitlab.com/lifegoeson-libs/*
          go env -w GONOSUMDB=gitlab.com/lifegoeson-libs/*

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Build — api
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o /dev/null ./cmd/api

      - name: Build — ingest
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o /dev/null ./cmd/ingest

      - name: Build — ws-gateway
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o /dev/null ./cmd/ws-gateway

      - name: Build — worker-dispatch
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o /dev/null ./cmd/worker-dispatch

      - name: Build — worker-push
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o /dev/null ./cmd/worker-push

# ─── SECURITY ─────────────────────────────────────────────────────────────────

  trivy-scan:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: fs-report.txt
          exit-code: "0"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: fs-report.txt
          retention-days: 7

  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Print leak report
        if: always()
        run: |
          echo "=========================================="
          echo "GITLEAKS SECRET SCAN RESULTS"
          echo "=========================================="
          if [ -f gitleaks-report.json ]; then
            python3 -c "
          import json, sys
          with open('gitleaks-report.json') as f:
              data = json.load(f)
          if not data:
              print('No secrets found.')
          for item in data:
              print('━' * 42)
              print(f'LEAK FOUND!')
              print(f'File:  {item.get(\"File\",\"\")}')
              print(f'Line:  {item.get(\"StartLine\",\"\")}')
              print(f'Rule:  {item.get(\"RuleID\",\"\")}')
              print(f'Match: {item.get(\"Match\",\"\")}')
              print('━' * 42)
          " 2>/dev/null || cat gitleaks-report.json
          else
            echo "No report generated."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

# ─── RELEASE — 5 parallel Docker builds ───────────────────────────────────────

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    environment: CI                  # ← secrets are scoped to this environment
    needs: [build, trivy-scan, gitleaks-scan]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    strategy:
      matrix:
        service: [api, ingest, ws-gateway, worker-dispatch, worker-push]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h

      - name: Get short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-${{ matrix.service }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-${{ matrix.service }}:v1.0.${{ steps.vars.outputs.short_sha }}
          secrets: |
            gitlab_token=${{ secrets.GITLAB_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Summary
        run: |
          echo "Pushed:"
          echo "  ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-${{ matrix.service }}:latest"
          echo "  ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}-${{ matrix.service }}:v1.0.${{ steps.vars.outputs.short_sha }}"
